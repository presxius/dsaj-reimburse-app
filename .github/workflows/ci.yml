name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: reimburse
          POSTGRES_PASSWORD: reimburse
          POSTGRES_DB: reimburse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reimburse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql+psycopg://reimburse:reimburse@localhost:5432/reimburse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # sama dengan image backend
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Tes (SQLite)
        run: python -m pytest -q
      - name: Tes (PostgreSQL)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}

      # Tes di atas memakai create_all/drop_all, jadi database kosong lagi di sini.
      - name: Migrasi bisa dijalankan dan sesuai model
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
          flask --app wsgi db downgrade base
          flask --app wsgi db upgrade

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # sama dengan stage build di deployment/nginx/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend (tanpa OCR)
        run: docker build -t reimburse-backend ./backend
      - name: Build image nginx + frontend
        run: docker build -t reimburse-nginx -f deployment/nginx/Dockerfile .
      - name: Cek sintaks skrip shell
        run: |
          sh -n deployment/backup.sh
          sh -n backend/docker-entrypoint.sh

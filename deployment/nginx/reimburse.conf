server {
    listen 80;
    server_name reimburse.example.local;

    # Hasil `npm run build` dari frontend/
    root /var/www/reimburse/build;
    index index.html;

    client_max_body_size 6m;   # sedikit di atas MAX_RECEIPT_SIZE (5 MB)

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # OCR bisa memakan waktu
    }

    # SPA: semua rute selain file statis jatuh ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
